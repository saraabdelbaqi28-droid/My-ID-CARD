<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sara Mohamed - Identity Card</title>
  <style>
    /* ==========================================================================
       CSS VARIABLES & THEMING
       Change colors, fonts, sizes, and card dimensions in one place.
       ========================================================================== */
    :root {
      /* Card Physical Dimensions (ISO/IEC 7810 ID-1 standard) */
      --card-width: 85.6mm;
      --card-height: 54mm;
      --card-radius: 3.18mm; /* Standard corner radius for ID cards */

      /* Palette: Metallic Blue & White with Gradient Lighter Blue Accent */
      --bg-canvas: #0f172a;
      --card-bg-start: #112236;
      --card-bg-mid: #1e3a5f;
      --card-bg-end: #0d1b2a;
      --card-accent-start: #38bdf8;
      --card-accent-end: #818cf8;
      --text-primary: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --label-color: #38bdf8;
      
      /* Disabled / Greyed out state for unsupplied accounts */
      --disabled-social: rgba(255, 255, 255, 0.25);

      /* Visual Polish & Light Effects */
      --card-border-light: rgba(255, 255, 255, 0.25);
      --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.15);
      --focus-ring: #38bdf8;

      /* Typography scale scaled proportionally to fit physical card dimensions */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --text-name: 11pt;
      --text-role: 7pt;
      --text-org: 6.5pt;
      --text-detail: 7pt;
      --text-label: 5pt;
    }

    /* ==========================================================================
       GLOBAL RESETS & SCREEN LAYOUT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-canvas);
      font-family: var(--font-family);
      color: var(--text-primary);
      padding: 1rem;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Outer wrapper providing 3D perspective space for interactive tilt */
    .card-perspective {
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    /* ==========================================================================
       IDENTITY CARD CONTAINER & METALLIC LIGHTING EFFECTS
       ========================================================================== */
    .id-card {
      position: relative;
      width: var(--card-width);
      height: var(--card-height);
      border-radius: var(--card-radius);
      background: linear-gradient(135deg, var(--card-bg-start) 0%, var(--card-bg-mid) 50%, var(--card-bg-end) 100%);
      box-shadow: var(--card-shadow);
      display: grid;
      grid-template-columns: 34% 66%;
      padding: 4.5mm;
      overflow: hidden;
      user-select: none;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      transform-style: preserve-3d;
      
      /* Subtle light edge catching highlights (bevel effect) */
      border: 1px solid var(--card-border-light);
    }

    /* Metallic dynamic sheen overlay driven by cursor movement */
    .id-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at var(--sheen-x, 50%) var(--sheen-y, 50%),
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.05) 25%,
        transparent 60%
      );
      pointer-events: none;
      z-index: 5;
    }

    /* Fine metallic brush texture lines */
    .id-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.015),
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Micro metallic accent bar on card header */
    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1.5mm;
      background: linear-gradient(90deg, var(--card-accent-start), var(--card-accent-end));
      z-index: 4;
    }

    /* ==========================================================================
       LEFT COLUMN: PHOTO & PRIMARY IDENTIFICATION
       ========================================================================== */
    .card-left {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-right: 2mm;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Avatar Container with rounded square crop */
    .photo-frame {
      width: 17mm;
      height: 17mm;
      border-radius: 3.5mm;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2mm;
      flex-shrink: 0;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback Initials Badge if image fails to load */
    .initials-fallback {
      display: none;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--card-accent-start), var(--card-accent-end));
      color: #ffffff;
      font-weight: 700;
      font-size: 8pt;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.5px;
    }

    .user-name {
      font-size: var(--text-name);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: 0.8mm;
      letter-spacing: -0.2px;
      word-break: break-word;
    }

    .user-title {
      font-size: var(--text-role);
      font-weight: 600;
      color: var(--card-accent-start);
      line-height: 1.15;
      margin-bottom: 0.5mm;
    }

    .user-org {
      font-size: var(--text-org);
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.1;
    }

    /* ==========================================================================
       RIGHT COLUMN: CONTACT DETAILS & SOCIAL ACCOUNTS
       ========================================================================== */
    .card-right {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-left: 3.5mm;
      padding-top: 1mm;
    }

    .contact-group {
      display: flex;
      flex-direction: column;
      gap: 1.8mm;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
    }

    .item-label {
      font-size: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--label-color);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.3mm;
    }

    .item-value {
      font-size: var(--text-detail);
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      border-radius: 2px;
    }

    /* Tap and focus states for phone/email links */
    a.item-value:hover, a.item-value:focus {
      color: var(--card-accent-start);
      text-decoration: underline;
    }

    /* Social Row Container */
    .social-row {
      display: flex;
      align-items: center;
      gap: 1.5mm;
      margin-top: 1mm;
    }

    /* Ensure minimum tap target of 44x44px for accessibility on mobile screens while visually maintaining card scaling */
    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      margin: -14px; /* Pull negative margin to keep visual spacing tight */
      padding: 14px;
      border-radius: 50%;
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.2s, opacity 0.2s;
      outline: none;
    }

    .social-link svg {
      width: 3.8mm;
      height: 3.8mm;
      fill: currentColor;
    }

    /* Active link state */
    .social-link:not(.disabled):hover,
    .social-link:not(.disabled):focus {
      color: var(--card-accent-start);
    }

    /* Disabled social icons style */
    .social-link.disabled {
      color: var(--disabled-social);
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Accessible focus rings */
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* ==========================================================================
       ACTION BUTTONS (SCREEN ONLY)
       ========================================================================== */
    .actions-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .print-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      min-height: 44px; /* Accessible tap target */
    }

    .print-btn:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .print-btn:active {
      transform: translateY(0);
    }

    .print-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ==========================================================================
       PRINT STYLES (EXACT SIZE 85.6mm x 54mm ON PHYSICAL PAPER)
       ========================================================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        height: 100%;
        padding: 0;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Hide interactive background UI, button, and instructions */
      .actions-container,
      .card-perspective {
        margin: 0;
        perspective: none;
      }

      .actions-container {
        display: none !important;
      }

      /* Lock identity card to exact physical dimensions */
      .id-card {
        width: 85.6mm !important;
        height: 54mm !important;
        box-shadow: none !important;
        transform: none !important;
        border: 0.5pt solid #cbd5e1 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        page-break-inside: avoid;
      }

      /* Disable dynamic sheen during printing */
      .id-card::before, .id-card::after {
        display: none !important;
      }
    }

    /* ==========================================================================
       ACCESSIBILITY & MOTION PREFERENCES
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      .id-card {
        transition: none !important;
        transform: none !important;
      }
      .id-card::before {
        display: none;
      }
    }
  </style>
</head>

  <!-- JavaScript Interactions -->
  <script>
    // ==========================================================================
    // IMAGE FALLBACK HANDLER
    // Show initials badge if user photo URL fails to load
    // ==========================================================================
    function handleImageError() {
      const img = document.getElementById('userPhoto');
      const fallback = document.getElementById('initialsFallback');
      if (img) img.style.display = 'none';
      if (fallback) fallback.style.display = 'flex';
    }

    // ==========================================================================
    // REALISTIC 3D TILT & SHEEN CURSOR EFFECT
    // Responsive, subtle physical tilt tracking the pointer
    // ==========================================================================
    (function initCardTilt() {
      const card = document.getElementById('idCard');
      if (!card) return;

      // Respect reduced motion preference
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) return;

      const maxTiltDegrees = 8; // Keep motion subtle so content is always easy to read

      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const cardWidth = rect.width;
        const cardHeight = rect.height;

        // Calculate cursor position relative to card center (-1 to 1)
        const xVal = e.clientX - rect.left;
        const yVal = e.clientY - rect.top;

        const xPercentage = (xVal / cardWidth) * 100;
        const yPercentage = (yVal / cardHeight) * 100;

        const xOffset = (xVal - cardWidth / 2) / (cardWidth / 2);
        const yOffset = (yVal - cardHeight / 2) / (cardHeight / 2);

        // Calculate tilt angles
        const rotateX = (-yOffset * maxTiltDegrees).toFixed(2);
        const rotateY = (xOffset * maxTiltDegrees).toFixed(2);

        // Apply 3D transform and dynamic sheen light coordinate
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        card.style.setProperty('--sheen-x', `${xPercentage}%`);
        card.style.setProperty('--sheen-y', `${yPercentage}%`);
      });

      // Smoothly return card to rest state when cursor leaves
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        card.style.setProperty('--sheen-x', '50%');
        card.style.setProperty('--sheen-y', '50%');
      });
    })();
  </script>
